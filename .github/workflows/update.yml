name: Обновить расписание

on:
  schedule:
    - cron: "17 */3 * * *"   # каждые 3 часа
  workflow_dispatch:          # кнопка «Run workflow» для ручного запуска
  push:
    branches: [main]
    paths:
      - "config.json"
      - "make_calendar.py"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Установить библиотеки
        run: pip install -r requirements.txt

      - name: Скачать расписание и собрать календарь
        run: python make_calendar.py

      - name: Сохранить календарь
        if: ${{ !cancelled() }}   # сохраняем то, что успели скачать, даже при ошибке
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule.ics status.json 2>/dev/null || git add schedule.ics
          if git diff --cached --quiet; then
            echo "Без изменений"
          else
            # status.json — отметка об удачной проверке (раз в 12 ч); заодно не даёт
            # GitHub отключить автозапуск через 60 дней без изменений
            if git diff --cached --quiet -- schedule.ics; then msg="Отметка: сайт доступен"; else msg="Расписание обновлено"; fi
            git commit -m "$msg"
            git push
          fi
